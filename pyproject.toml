[project]
name = "claude-sentinel"
version = "0.8.0"
description = "Local, source-cited Claude environment and account-risk self-check"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "claude-sentinel contributors" }]
dependencies = [
    "httpx[socks]>=0.27,<1",
    "rich>=13.7,<15",
    "typer>=0.12,<1",
    "pydantic>=2.6,<3",
    "jinja2>=3.1,<4",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6.0,<7",
]

[project.scripts]
sentinel = "claude_sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_sentinel"]

[tool.hatch.build.targets.sdist]
exclude = [".uv-cache", ".uv-python", ".runtime", ".chrome-*", ".venv", "dist"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP045", "UP035"]
